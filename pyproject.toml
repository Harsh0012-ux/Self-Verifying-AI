[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "self-verifying-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2", "alembic>=1.13", "docker>=7.1", "httpx>=0.27",
  "openai>=1.0", "pydantic-settings>=2.4"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a local Docker daemon and sva-sandbox image"]

[tool.ruff]
line-length = 100
